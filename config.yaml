ingestion:
  provider: waha               # whapi | waha | openwa  (webhook goes to /webhook/<provider>)
  capture_events: ["post", "put", "delete", "status"]
  include_outgoing: true

# Per-provider settings (only the active provider's section is used).
# Backfill (history pull) is a whapi capability; waha/openwa are live-only.
providers:
  whapi: {}
  waha:
    base_url: "http://localhost:3000"
    session: "default"
    api_key: "fixed-waha-key-2026"
  openwa:
    base_url: "http://localhost:8080"
    session: "default"
    api_key: ""

backfill:
  enabled: true               # history catch-up (uses API quota)
  interval_seconds: 72000
  per_chat_page_size: 100
  initial_history_pages: 5
  window_hours: 72            # only backfill history from the last 24h

media:
  max_concurrent_downloads: 3
  download_jitter_ms: [100, 500]
  retry_attempts: 3

